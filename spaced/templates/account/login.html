{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel='stylesheet' type='text/css' href="{% static 'account/css/login.css' %}">
	<title>Login</title>
</head>
<body>
	<div class="card">
		<div class="welcome">
			<img class="welcome-image" src="#">
			<h2 class="welcome-login">Добро пожаловать!</h3>
		</div>
		<form method="POST" action="">
			{% csrf_token %}
			<div class="input">
				<p>Почта:</p>
				<input type="text" name="login" placeholder="Введите логин">
			</div>
			<div class="input">
				<p>Пароль:</p>
				<input type="password" name="password" placeholder="Введите пароль">
			</div>
			<div class="button">
				<button class="button-login" type="submit">Войти</button>
			</div>

			{% for message in messages %}
				<p class="message">{{message}}</p>
			{% endfor %}
			{{form}}
		</form>
	</div>
</body>
</html>
